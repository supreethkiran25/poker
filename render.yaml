services:
  - type: web
    name: poker-server
    env: node
    plan: free
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w packages/poker-engine && npm run build -w apps/server
    startCommand: npm run start -w apps/server
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: "*"
