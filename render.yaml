services:
  - type: web
    name: poker-app
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node apps/server/dist/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: "*"
