services:
  - type: web
    name: poker-app
    env: node
    plan: free
    buildCommand: npm ci --prefer-offline --no-audit --no-fund && npm run build
    startCommand: node apps/server/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: "*"
